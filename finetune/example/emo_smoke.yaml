data:
  train_data: /iopsstor/scratch/cscs/mrohania/datasets/DailyTalkEmoDim/dailytalk_emo.jsonl
  eval_data: ""
  shuffle: true
moshi_paths:
  hf_repo_id: "kyutai/moshiko-pytorch-bf16"
full_finetuning: false
lora: {enable: true, rank: 64, scaling: 2., ft_embed: false}
first_codebook_weight_multiplier: 100.
text_padding_weight: .5
duration_sec: 20
batch_size: 2
max_steps: 4
gradient_checkpointing: true
optim: {lr: 2e-6, weight_decay: 0.1, pct_start: 0.05}
seed: 0
log_freq: 1
do_eval: false
do_ckpt: true
ckpt_freq: 4
save_adapters: true
run_dir: /iopsstor/scratch/cscs/mrohania/moshi_runs/emo_smoke
